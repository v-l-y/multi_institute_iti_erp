# Manual production overlay; requires operator-managed DNS, TLS certs and proxy CIDR.
services:
  database:
    volumes:
      - ./deployment/production-runtime-grants.sql:/docker-entrypoint-initdb.d/03-runtime-grants.sql:ro
  backend:
    environment:
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?Set trusted proxy network in root .env}
      ALLOW_OFFICIAL_RECORD_IMPORT: ${ALLOW_OFFICIAL_RECORD_IMPORT:-0}
      AUTH_RECOVERY_MODE: disabled
      PRIVATE_DOCUMENT_ROOT: /var/lib/iti-private/documents
    volumes:
      - production_private:/var/lib/iti-private
  reverse-proxy:
    image: nginx:stable-alpine
    environment:
      ERP_DOMAIN: ${ERP_DOMAIN:?Set production hostname in root .env}
      NGINX_ENVSUBST_FILTER: "^ERP_DOMAIN$"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deployment/certs:/etc/nginx/certs:ro
    restart: unless-stopped
volumes:
  production_private:
