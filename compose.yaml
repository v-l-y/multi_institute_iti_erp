services:
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:80"
    environment:
      APP_TIMEZONE: Asia/Kolkata
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: multi_institute_iti_erp
      DB_USERNAME: iti_erp
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in the root .env file}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$r=json_decode(@file_get_contents('http://127.0.0.1/api/v1/ready'),true); exit(($r['data']['status']??null)==='ready'?0:1);"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  database:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: multi_institute_iti_erp
      MARIADB_USER: iti_erp
      MARIADB_PASSWORD: ${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in the root .env file}
      MARIADB_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:?Set DOCKER_DB_ROOT_PASSWORD in the root .env file}
    volumes:
      - database_data:/var/lib/mysql
      - ./backend/database/schema/iti_erp_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/schema/integrity_guards.sql:/docker-entrypoint-initdb.d/02-integrity-guards.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

volumes:
  database_data:
