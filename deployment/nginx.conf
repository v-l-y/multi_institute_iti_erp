# Single ingress; proxy rewrites forwarded headers and rate-limits by real client IP.
limit_req_zone $binary_remote_addr zone=iti_login:10m rate=10r/m;
server_tokens off;

upstream iti_backend {
    server backend:80;
    keepalive 16;
}
server {
    listen 80;
    server_name ${ERP_DOMAIN};
    return 301 https://${ERP_DOMAIN}$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name ${ERP_DOMAIN};
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    client_max_body_size 24k;
    location = /api/v1/documents/upload {
        client_max_body_size 8m;
        proxy_pass http://iti_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }

    location = /api/v1/auth/login {
        limit_req zone=iti_login burst=5 nodelay;
        proxy_pass http://iti_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }
    location / {
        proxy_pass http://iti_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }
}
